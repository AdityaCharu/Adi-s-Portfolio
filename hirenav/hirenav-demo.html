<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HireNav Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: HireNav's own three-column shell (nav · workspace · role rail) under a thin demo strip,
   with a dark-green tour layer floating above. Single light theme on purpose: it mirrors the real product UI. */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --sunk:#f1f4f2; --line:#e2e7e4; --line-2:#d1d9d5;
  --ink:#111a15; --ink-2:#45514a; --ink-3:#76827c;
  --green:#127a50; --green-hover:#0d6744; --green-ink:#0c6240; --green-soft:#e7f6ee; --green-line:#c1e6d3; --green-mid:#5fbf93;
  --amber:#c98a12; --amber-soft:#fff6e6; --amber-line:#f4daa9; --amber-ink:#8a5600;
  --red:#c03f2c; --red-soft:#fdefeb; --red-line:#f2cabf;
  --manual:#b9c2bd;
  --overlay:rgba(26,56,44,.46);
  --guide:#0b3022; --guide-2:#14493a; --guide-ink:#ebf8f1; --guide-mute:#a8ccbb; --guide-accent:#7fe3b5;
  --ring:#16b374; --toast:#0d3a29; --shadow:0 18px 50px rgba(16,40,30,.18); --shadow-sm:0 1px 2px rgba(16,40,30,.05),0 4px 14px rgba(16,40,30,.04);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Plus Jakarta Sans","Inter",system-ui,-apple-system,sans-serif;
  --gh:0px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a.btn{text-decoration:none}
h1,h2,h3,h4,h5{margin:0;font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab{font-variant-numeric:tabular-nums}

.strip{background:var(--guide);color:var(--guide-mute);font-size:13px;display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.strip b{color:var(--guide-ink);font-weight:600}
.strip .grow{flex:1;min-width:0}
.strip button{border:0;background:var(--guide-accent);color:var(--guide);font-weight:700;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;min-height:calc(100vh - 37px)}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 16px;gap:18px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px;font-family:var(--f-display);font-weight:800;font-size:21px;color:var(--green-ink);letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--green-soft);color:var(--ink);font-weight:600}
.nav .ic{color:var(--ink-3)}
.nav .cnt{margin-left:auto;font-size:11.5px;background:var(--sunk);border-radius:999px;padding:1px 8px;color:var(--ink-3);font-weight:600}
.nav button[aria-current="page"] .cnt{background:var(--surface)}
.owner{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.owner-id{display:flex;gap:10px;align-items:center;padding:0 4px}
.owner-id .av{background:var(--green);color:#fff;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-weight:700}
.owner-id b{display:block;font-size:13px}
.owner-id small{color:var(--ink-3);font-size:12px}
.sidecta{background:var(--guide);color:var(--guide-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sidecta b{font-family:var(--f-display);font-size:15px}
.sidecta p{color:var(--guide-mute);font-size:12.5px}
.sidecta button{border:0;background:var(--guide-accent);color:var(--guide);border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 22px;flex-wrap:wrap}
.topbar select{min-width:0;flex:0 1 300px}
.topbar .grow{flex:1}
.content{padding:18px 22px calc(48px + var(--gh)) 22px;display:flex;flex-direction:column;gap:22px;max-width:1020px;width:100%}
.content.enter > *{animation:rise .32s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--green-ink)}
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead h1{font-size:32px;font-weight:800;line-height:1.15}
.pagehead p{color:var(--ink-2);font-size:15px;max-width:68ch}
.headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{display:flex;flex-direction:column;gap:14px}

.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-left:1px solid var(--line);padding:20px 18px calc(24px + var(--gh));display:flex;flex-direction:column;gap:18px}
.rail h2{font-size:17px}
.rail .sect{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.rail .lbl{color:var(--ink-2)}
.rlabel{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.briefcard{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.briefcard b{font-size:15px}
.conns{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;color:var(--ink-2);font-size:13px}
.conns li{display:flex;gap:8px;align-items:baseline}
.conns li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;transform:translateY(-1px)}
.conns b{color:var(--ink);font-weight:600}
.mini-funnel{display:flex;flex-direction:column;gap:6px}
.mini-funnel .r{display:grid;grid-template-columns:86px 1fr 26px;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.mini-funnel .b{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.mini-funnel .b i{display:block;height:100%;background:var(--green);border-radius:4px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-hover)}
.btn.danger{color:var(--red);border-color:var(--red-line)}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--green-soft);border-color:var(--green-line);color:var(--green-ink)}
.btn.primary.on{background:var(--green-hover);color:#fff}
.linkbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--green-ink);font-weight:500;cursor:pointer;padding:4px 0}
.linkbtn:hover{text-decoration:underline}
select,input[type=text],input[type=email],input[type=tel],input[type=number],input[type=datetime-local],input[type=search],textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
select{appearance:auto;font-weight:500}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld .lbl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.fld .lbl.plain{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.fld small{color:var(--ink-3);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);cursor:pointer}
.check input{margin-top:3px;accent-color:var(--green);width:16px;height:16px;flex:none}
.err{color:var(--red);font-size:13px;font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm)}
.card h3{font-size:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow-sm)}
.stat span{color:var(--ink-2);font-size:13px}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.stat b.g{color:var(--green-ink)}
.stat small{color:var(--ink-3);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--sunk);color:var(--ink-2);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill .ic{width:12px;height:12px;stroke-width:2.5}
.pill.g{background:var(--green-soft);border-color:var(--green-line);color:var(--green-ink)}
.pill.a{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber-ink)}
.pill.r{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
.pill.d{background:var(--guide);border-color:var(--guide);color:var(--guide-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--green-soft);color:var(--green-ink);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500}
.ev{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;border-radius:7px;padding:2px 8px;font-weight:500}
.ev.y{background:var(--green-soft);color:var(--green-ink)}
.ev.n{background:var(--amber-soft);color:var(--amber-ink)}
.ev .ic{width:12px;height:12px;stroke-width:2.6}
.meta{color:var(--ink-3);font-size:13px}
.fine{color:var(--ink-3);font-size:12.5px}
.note{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink-2);background:var(--surface)}
.note.green{background:var(--green-soft);border-color:var(--green-line);color:var(--ink)}
.note .ic{margin-top:2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:36px 16px}
.empty svg.logo{width:48px;height:48px;margin-bottom:6px}
.empty h3{font-size:18px}
.empty p{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kv div{background:var(--sunk);border-radius:10px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kv b{font-weight:600;font-size:13.5px;word-break:break-word}

.ring-s{position:relative;flex:none;display:grid;place-items:center}
.ring-s svg{transform:rotate(-90deg)}
.ring-s em{position:absolute;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.ring-s.big em{font-size:22px}
.ring-s small{position:absolute;bottom:-16px;font-size:10.5px;color:var(--ink-3);white-space:nowrap;font-weight:600}

.stepper{list-style:none;margin:0;padding:14px 18px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-3)}
.stepper .dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.stepper li.done{color:var(--green-ink)}
.stepper li.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.stepper li.cur{color:var(--ink)}
.stepper li.cur .dot{border-color:var(--green);color:var(--green-ink)}
.stepper .bar{flex:1;min-width:30px;height:2px;background:var(--line);border-radius:2px}
.stepper .bar.on{background:var(--green)}

.searching{background:var(--green-soft);border:1px solid var(--green-line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.searching .row{display:flex;gap:12px;align-items:center}
.searching svg.logo{width:32px;height:32px;flex:none;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.searching b{font-family:var(--f-display);font-size:16px}
.searching .row p{color:var(--ink-2);font-size:13px}
.progress{height:5px;background:rgba(18,122,80,.15);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .6s ease}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
.loglist li{display:flex;gap:8px}
.loglist li::before{content:"✓";color:var(--green);font-weight:700}
.loglist li.now::before{content:"•";animation:blink 1s infinite}
.loglist li .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
@keyframes blink{50%{opacity:.2}}
.skel{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--sunk) 0%,#fff 50%,var(--sunk) 100%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.summary{display:flex;flex-direction:column;gap:16px}
.summary .t{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.summary .t .ib{width:34px;height:34px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;color:var(--green-ink)}
.bigstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bigstats div{border-radius:12px;background:var(--sunk);padding:12px 14px}
.bigstats b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.bigstats span{color:var(--ink-2);font-size:13px}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .r{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;gap:12px;align-items:center;font-size:13.5px}
.funnel .r span{color:var(--ink-2)}
.funnel .b{height:22px;background:var(--sunk);border-radius:6px;overflow:hidden}
.funnel .b i{display:block;height:100%;background:var(--green);border-radius:0 4px 4px 0;min-width:3px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.funnel .r b{text-align:right;font-variant-numeric:tabular-nums}
.confirm{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.confirm ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
details summary{cursor:pointer;color:var(--green-ink);font-weight:600}
details pre{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:12px;font-size:12.5px;margin:10px 0 0;overflow-x:auto}

.listhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.listhead h2{font-size:21px}
.filters{display:flex;gap:10px;align-items:center}
.filters input{flex:1}
.filters select{flex:0 0 170px}
.cands{display:flex;flex-direction:column;gap:12px}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;scroll-margin-top:110px;box-shadow:var(--shadow-sm);transition:border-color .2s}
.cand:hover{border-color:var(--line-2)}
.cand .rk{grid-row:span 3;display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:2px}
.cand .rk .no{font-size:11.5px;color:var(--ink-3);font-weight:700}
.cand-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.cand-top .nm{font-family:var(--f-display);font-weight:700;font-size:17px;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.cand-top .nm:hover{color:var(--green-ink)}
.cand .hl{color:var(--ink-2)}
.facts{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px}
.facts span{display:inline-flex;gap:5px;align-items:center}
.facts .ic{width:13px;height:13px}
.cand .evs{display:flex;gap:6px;flex-wrap:wrap}
.cand .actions{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
.cand.post{opacity:.82}
.match{display:flex;flex-direction:column;gap:12px}
.match-h{display:flex;justify-content:space-between;align-items:center;gap:14px}
.match h4{font-size:16px}
.match > p{color:var(--ink-2)}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hi,.gaps{border-radius:12px;padding:14px;font-size:13.5px}
.hi{background:var(--green-soft);border:1px solid var(--green-line)}
.gaps{background:var(--amber-soft);border:1px solid var(--amber-line)}
.hi h5,.gaps h5{font-family:var(--f-body);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.hi h5{color:var(--green-ink)} .gaps h5{color:var(--amber-ink)}
.hi ul,.gaps ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.unlock{display:flex;gap:12px;align-items:center;background:var(--guide);color:var(--guide-ink);border-radius:12px;padding:12px 14px}
.unlock b{font-family:var(--f-display)}
.unlock p{color:var(--guide-mute);font-size:13px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm)}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--ink-2);font-weight:600;background:var(--surface)}
tr:last-child td{border-bottom:0}
td .nm{color:var(--green-ink);font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-align:left}
td .sub{color:var(--ink-2);font-size:13px}
td input[type=checkbox],th input[type=checkbox]{accent-color:var(--green);width:16px;height:16px}
.r{text-align:right}
.scorebar{display:flex;align-items:center;gap:8px;min-width:130px}
.scorebar .b{flex:1;height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}
.scorebar .b i{display:block;height:100%;border-radius:4px;background:var(--green)}
.scorebar b{font-variant-numeric:tabular-nums;width:26px;text-align:right}
.atsnums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 4px}
.atsnums b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.atsnums span{color:var(--ink-2);font-size:13px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input[type=search]{flex:0 1 220px}
.toolbar .grow{flex:1}
.activity{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.activity li{display:flex;gap:10px}

  o.gaps=['Describes an open role rather than this person’s experience.']; return o;
 }
 const locOk=/bengaluru/i.test(p.loc)&&(!r.location||/bengaluru/i.test(r.location));
 if(p.withhold){
  o.withheld=true;
  o.summary=ev.length?`Strong evidence for ${listJoin(ev)}${locOk?`, based in ${r.location||p.loc}`:''}. ${listJoin(miss)} ${miss.length>1?'are':'is'} not stated and years of experience are unknown, so the score is withheld instead of guessed.`:`The public excerpt is too short to show evidence for ${listJoin(sk)}. HireNav withholds a score until there’s something to check.`;
  o.highlights=ev.map(s=>`${s} shown in public work`);
  o.gaps=[...miss.map(m=>`“${m}” is not mentioned in the profile text.`),'Years of experience are not stated.'];
  if(r.min&&r.max) o.gaps.push(`Can’t confirm the brief’s ${r.min}–${r.max} year range yet.`);
  return o;
 }
 o.score=Math.max(30,Math.min(97,Math.round(55+40*ev.length/sk.length+(p.bonus||0))));
 const band=r.min&&r.max&&p.years!=null?(p.years>=+r.min&&p.years<=+r.max):null;
 o.summary=`${ev.length?`Evidence for ${listJoin(ev)}`:'Little direct evidence for the required skills'}${p.years!=null?`, ${p.years} years of experience`:''}, ${locOk?`based in ${r.location||p.loc}`:p.loc}.${miss.length?` ${listJoin(miss)} ${miss.length>1?'are':'is'} not shown.`:' Every required skill group is covered.'}`;
 o.highlights=[...ev.map(s=>`${s}: ${p.extra||'shown in public work'}`),...(band?[`${p.years} years, inside the ${r.min}–${r.max} band`]:[])];

/* brief */
function openBrief(){ openModal({type:'brief',mode:'edit'}); }
function saveBrief(){
 const v=id=>$('#'+id).value.trim();
 const title=v('bf-title');
 if(!title){showErr('bf-err','Add a role title so HireNav knows what to search for.');return;}
 const data={title,location:v('bf-loc'),min:v('bf-min'),max:v('bf-max'),skills:v('bf-skills').split(',').map(s=>s.trim()).filter(Boolean),headline:v('bf-head'),exclude:v('bf-ex'),notes:v('bf-notes')};
 if(data.min&&data.max&&+data.min>+data.max){showErr('bf-err','Minimum years can’t be more than maximum years.');return;}
 const m=S.modal;
 if(m.mode==='create'){const r={id:nid('r'),search:'idle',lastSearch:null,created:new Date(),firstShortlist:null,...data};S.roles.push(r);S.active=r.id;log(`Created the hiring brief for ${title}.`);}
 else {const r=m.roleId?roleById(m.roleId):role();Object.assign(r,data);log(`Updated the hiring brief for ${title}.`);}
 mark('brief');
 closeModal(); go('workspace'); toast('Hiring brief saved.'); emit('brief:saved');
}
let typing=false;

 typing=true;
 const fields=[['bf-title',EXAMPLE.title],['bf-loc',EXAMPLE.loc],['bf-min',EXAMPLE.min],['bf-max',EXAMPLE.max],['bf-skills',EXAMPLE.skills],['bf-head','Creative Producer, AI Filmmaker']];

/* phone */
function fillPhone(){
 if(!S.modal||S.modal.type!=='phone') openModal({type:'phone',id:featId()});
 if(S.modal.phase) return;
 if(!$('#ph-num').value) $('#ph-num').value='+91 98765 43210';
 $('#ph-c1').checked=true; $('#ph-c2').checked=true;
 const b=$('[data-tour="place-call"]'); if(b) b.focus();
}
async function placeCall(){
 const num=$('#ph-num').value.trim();
 if(num.replace(/\D/g,'').length<8){showErr('ph-err','Add the candidate’s phone number first.');return;}
 if(!$('#ph-c1').checked||!$('#ph-c2').checked){showErr('ph-err','Tick both boxes to place the call.');return;}
 const qs=$('#ph-q').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,3);
 const m=S.modal, c=cand(m.id);
 m.phase='calling'; m.log=[{t:`Dialling ${num} from the HireNav voice agent`}]; renderModal();
 const steps=[{t:'Connected. The assistant introduced itself:',q:`Hi ${c.name.split(' ')[0]}, I’m an AI chatbot calling from Northwind Studios about the ${roleById(c.roleId).title} role. Do you have a few minutes for some quick questions?`}];
 qs.forEach((q,i)=>steps.push({t:`Q${i+1} · ${q}`,q:i===0&&!c.miss.length?'I’ve led video and content production end to end for most of my career.':CALL_ANSWERS[i]||'Thanks, that covers it.'}));
 steps.push({t:'Call ended · transcript saved · AI summary written'});
 for(const s of steps){ await sleep(950); if(S.modal!==m) return; m.log.push(s); renderModal(true); const b=$('#mBody'); if(b) b.scrollTop=b.scrollHeight; }
 const before=c.score; let closed=[];
 if(c.miss.length){ closed=[c.miss[0]]; c.callEv=c.miss[0]; c.ev=c.ev.concat(closed); c.miss=c.miss.slice(1); }
 if(c.years==null) c.years=6;
 if(!c.phone) c.phone=num;
 if(c.kind!=='post'){
  const sk=c.ev.length+c.miss.length||1;
  c.score=c.withheld||before==null?Math.min(96,Math.round(62+32*c.ev.length/sk)):Math.min(97,before+Math.round(30/sk));
  c.withheld=false;
  c.gaps=c.gaps.filter(g=>!closed.some(s=>g.includes(s))&&!/Years of experience|year range|résumé text/.test(g));
  if(!c.gaps.length) c.gaps=['Review the portfolio before the interview.'];
  c.highlights=[...closed.map(s=>`${s}: confirmed on the call with examples`),...c.highlights,`${c.years} years of experience (from the call)`];
  c.summary=`Evidence for ${listJoin(c.ev)}${c.miss.length?`; ${listJoin(c.miss)} still to confirm`:', every required skill group'}. ${c.years} years of experience, based in ${c.loc}. Ready for an interview.`;
  c.unlocked=closed.length?`${closed[0]} and ${c.years} years of experience`:`${c.years} years of experience`;
 }
 const rank=ranked(candsOf(c.roleId)).findIndex(x=>x.id===c.id)+1;
 m.result={title:before==null?`Score unlocked: ${c.score} · now #${rank}`:`Score ${before} → ${c.score} · now #${rank}`,body:closed.length?`The call confirmed ${closed[0]}, the one skill missing from public profiles, plus ${c.years} years of experience.`:`The call added ${c.years} years of experience and a confirmed location.`};
 m.phase='done'; renderModal(true); const b=$('#mBody'); if(b) b.scrollTop=b.scrollHeight;
 c.calls.push({t:new Date(),summary:`${qs.length} questions answered${closed.length?' · '+closed[0]+' confirmed':''}`});
 log(`Phone screening completed for ${c.name}${closed.length?`; ${closed[0]} confirmed`:''}.`);
 mark('review');
 render(); emit('call:done');
}

const BUSY=[[[9.5,11.5],[14,15]],[[11,12],[13,13.5],[16,17]]];
function findSlot(from,until,dmin){
 const base=new Date(from); base.setHours(0,0,0,0);
 const h=d=>(d-base)/3600000; let t=h(from); const end=h(until), du=dmin/60;
 let skipped=0;
 for(;t+du<=end+1e-9;t+=0.25){
  const clash=BUSY.some(bs=>bs.some(([a,b])=>t<b&&t+du>a));
  if(!clash) return {start:new Date(+base+t*3600000),skipped};
  skipped++;
 }
 return {start:new Date(from),skipped};
}

function emit(ev){
 if(!T.on) return; const s=STEPS[T.i]; if(!s||!s.on) return;
 if(s.on===ev){ T.i++; setTimeout(()=>{renderGuide();focusTarget(false)},420); }
}
function curTarget(){
 const s=STEPS[T.i]; if(!s||!s.target||!T.on) return null;
 const key=typeof s.target==='function'?s.target():s.target;
 return document.querySelector(`[data-tour="${key}"]`);
}
function focusTarget(force){
 setTimeout(()=>{
  const el=curTarget(), s=STEPS[T.i];
  if(!el&&force&&s&&s.prep){ s.prep(); setTimeout(()=>{const e2=curTarget(); if(e2) e2.scrollIntoView({block:'center',inline:'nearest',behavior:'smooth'});},260); return; }
  if(!el) return;
  const r=el.getBoundingClientRect(), gh=innerWidth<=1100?($('#guideHost').offsetHeight+20):20;
  if(force||r.top<80||r.bottom>innerHeight-gh) el.scrollIntoView({block:'center',inline:'nearest',behavior:'smooth'});
 },force?0:140);
}
function tourAction(a){
 const s=STEPS[T.i];
 if(a==='start'){T.on=true;T.i=1;T.min=false;S.milestones={start:Date.now()};renderGuide();focusTarget(true);}
 else if(a==='explore'){T.on=false;T.min=true;renderGuide();}
 else if(a==='min'){T.min=true;renderGuide();}
 else if(a==='open'){T.min=false;T.on=true;renderGuide();focusTarget(true);}
 else if(a==='back'){if(T.i>1){T.i--;renderGuide();const p=STEPS[T.i];if(p.prep)p.prep();focusTarget(true);}}
 else if(a==='next'){T.i++;renderGuide();focusTarget(true);}
 else if(a==='show'){focusTarget(true);}
 else if(a==='auto'){ if(s&&s.auto) Promise.resolve(s.auto()); }
 else if(a==='extra'){ if(s&&s.extra) s.extra[1](); }
 else if(a==='contact'){openModal({type:'contact'});}
 else if(a==='results'){openModal({type:'results'});}
 else if(a==='restart'){clearInterval(searchTimer);const lead=S.lead;S=initialState();S.lead=lead;renderModal();lastView=null;go('workspace');T.on=true;T.i=1;T.min=false;S.milestones={start:Date.now()};renderGuide();focusTarget(true);window.scrollTo({top:0});}
 else if(a==='finish'){T.on=false;T.min=true;renderGuide();}
}
function renderGuide(){
 const host=$('#guideHost'); const s=STEPS[T.i]; const total=STEPS.length-2;
 document.body.classList.toggle('guide-on',!T.min);
 if(T.min){
  host.innerHTML=`<button type="button" class="guide-pill" data-action="tour" data-id="open">${LOGO('width:20px;height:20px')}${T.on&&T.i>0&&!s.done?`Guide · step ${T.i} of ${total} <i>›</i>`:'Take the 5-minute tour <i>›</i>'}</button>`;
  document.documentElement.style.setProperty('--gh','70px'); return;
 }
 let inner;
 const elapsed=S.milestones.start?dur(Date.now()-S.milestones.start):null;
 if(s.welcome){
  inner=`<div class="gtop"><span>Guided demo · ${total} steps · about 5 min</span><button type="button" data-action="tour" data-id="explore">Hide</button></div>
   <h3>${s.title}</h3><p>${s.body}</p>
   <div class="chap">${CH.map(c=>`<span>${c}</span>`).join('')}</div>
   <div class="gact"><button type="button" class="gbtn p" data-action="tour" data-id="start">Start the tour</button><button type="button" class="gbtn" data-action="tour" data-id="explore">Look around first</button></div>`;
 } else if(s.done){
  inner=`<div class="gtop"><span>Tour complete${elapsed?' · '+elapsed:''}</span><button type="button" data-action="tour" data-id="min">Hide</button></div>
   <div class="gbar"><i style="width:100%"></i></div><h3>${s.title}</h3><p>${s.body}</p>
   <div class="gact"><button type="button" class="gbtn p" data-action="tour" data-id="contact">Get HireNav for my team</button><button type="button" class="gbtn" data-action="tour" data-id="results">My results</button><button type="button" class="gbtn" data-action="tour" data-id="restart">Restart</button></div>`;
 } else {
  inner=`<div class="gtop"><span>Step ${T.i} of ${total} · ${CH[s.ch]}</span><button type="button" data-action="tour" data-id="min">Hide</button></div>
   <div class="gbar"><i style="width:${Math.round((T.i-1)/total*100)}%"></i></div>
   <div class="chap">${CH.map((c,i)=>`<span class="${i===s.ch?'on':i<s.ch?'done':''}">${c}</span>`).join('')}</div>
   <h3>${s.title}</h3><p>${s.body}</p>
   ${s.extra?`<div class="gact"><button type="button" class="gbtn x" data-action="tour" data-id="extra">${s.extra[0]}</button></div>`:''}
   <div class="gact"><button type="button" class="gbtn" data-action="tour" data-id="back" ${T.i<=1?'disabled':''}>Back</button><button type="button" class="gbtn" data-action="tour" data-id="show">Show me</button>
    ${s.next?`<button type="button" class="gbtn p" data-action="tour" data-id="next">Next</button>`:`<button type="button" class="gbtn p" data-action="tour" data-id="auto">Do it for me</button>`}</div>`;
 }
 host.innerHTML=`<section class="guide" aria-live="polite" aria-label="Demo guide">${inner}</section>`;
 requestAnimationFrame(()=>{const g=$('.guide');document.documentElement.style.setProperty('--gh',(g?g.offsetHeight+16:0)+'px');});
}
(function loop(){
 const rg=$('#ringx'); const el=T.min?null:curTarget();
 if(el){const r=el.getBoundingClientRect(); if(r.width&&r.height){rg.hidden=false;rg.style.top=(r.top-5)+'px';rg.style.left=(r.left-5)+'px';rg.style.width=(r.width+10)+'px';rg.style.height=(r.height+10)+'px';} else rg.hidden=true;}
 else rg.hidden=true;
 requestAnimationFrame(loop);
})();

render(); renderGuide();
